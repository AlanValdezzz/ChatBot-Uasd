<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Estatuto UASD</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <h1>Chatbot del Estatuto Orgánico de la UASD</h1>

  <!-- preguntas sugeridas, las llena el script -->
  <div id="sugeridas"></div>

  <!-- aqui salen los mensajes (historial) -->
  <div id="chat"></div>

  <!-- campo y boton para escribir -->
  <div class="escribir">
    <input type="text" id="pregunta" placeholder="Escribe tu pregunta...">
    <button id="enviar">Enviar</button>
  </div>

  <!-- el orden importa: primero la key y el estatuto, luego el script -->
  <script src="config.js"></script>
  <script src="estatuto.js"></script>
  <script src="script.js"></script>
</body>
</html>
